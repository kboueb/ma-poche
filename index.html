<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f13" />
    <title>maPoche — Finances personnelles</title>
    <meta name="description" content="Gérez vos dépenses, revenus et patrimoine en toute souveraineté." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Applique le thème enregistré avant le premier rendu (évite un flash sombre en mode clair)
      try {
        var t = JSON.parse(localStorage.getItem("mapoche-theme") || "{}").state;
        if (t && t.theme === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>
  <body class="bg-surface-0 text-text-primary font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
